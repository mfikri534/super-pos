<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/noteme.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login-view" class="login-wrap">
  <div class="login-card card">
    <div class="login-brand">
      <div class="logo">S</div>
      <div>
        <h1>Super POS</h1>
        <p class="muted small">Kasir • Stok • Laporan • AI Copilot</p>
      </div>
    </div>

    <div class="tabs" id="login-tabs">
      <button class="tab active" data-mode="password">Password Staf</button>
      <button class="tab" data-mode="pin">PIN Kasir</button>
    </div>

    <form id="login-form" autocomplete="on">
      <label for="login-username">Username</label>
      <input id="login-username" type="text" placeholder="admin" autocomplete="username" required>

      <label for="login-secret" id="secret-label">Password</label>
      <input id="login-secret" type="password" placeholder="••••••••" autocomplete="current-password" required>

      <label class="check"><input type="checkbox" id="remember"> Ingat Terminal</label>

      <button class="btn primary w-full" type="submit" id="btn-login">Masuk</button>
      <p id="login-error" class="error-text hidden"></p>
    </form>

    <details class="conn">
      <summary>⚙ Koneksi API</summary>
      <label for="login-api-url">GAS Web App URL</label>
      <input id="login-api-url" type="url" placeholder="https://script.google.com/macros/s/AKfy.../exec">
      <p class="muted small">Default: admin / admin123 / PIN 123456</p>
    </details>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app-view" class="shell hidden">
  <aside class="rail">
    <div class="rail-brand">
      <div class="logo">S</div>
      <div>
        <strong>Super POS</strong>
        <span class="muted small" id="rail-outlet">Outlet</span>
      </div>
    </div>
    <nav id="rail-nav" class="rail-nav"></nav>
    <div class="rail-foot">
      <div class="user-chip">
        <div class="avatar" id="user-avatar">A</div>
        <div>
          <strong id="user-name">—</strong>
          <span class="muted small" id="user-role">—</span>
        </div>
      </div>
      <button class="btn ghost sm w-full" id="btn-logout">Keluar</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-actions">
        <span class="pill" id="shift-pill">Shift: —</span>
        <span class="pill brand" id="cart-pill">🛒 0</span>
      </div>
    </header>

    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar"></nav>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/printer.js"></script>
<script src="/js/gemini.js"></script>
<script src="/js/pos.js"></script>
<script src="/js/reports.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
